function pills(arr, cls) {
  return arr.map(s => `<span class="pill ${cls}">${s}</span>`).join("");
}

function matches(d, q) {
  return !q ||
    d.name.toLowerCase().includes(q) ||
    d.symbol.toLowerCase().includes(q) ||
    d.norm.toLowerCase().includes(q) ||
    d.def.toLowerCase().includes(q) ||
    d.dis.join(" ").toLowerCase().includes(q) ||
    d.src.join(" ").toLowerCase().includes(q) ||
    d.keys.includes(q);
}

function elementCards(items) {
  if (!items.length) return '<div class="no-result">😕 Hech narsa topilmadi</div>';
  return items.map(d => `
    <div class="card">
      <h3>${d.name} <span class="symbol">${d.symbol}</span></h3>
      <div class="norm">📏 Kunlik norma: ${d.norm}</div>
      <div class="section def">
        <b>⚠️ Tanqisligida:</b> ${d.def}
      </div>
      <div class="section src">
        <b>🥗 Manbalar:</b>
        ${d.src.map(s => `<span class="badge">${s}</span>`).join("")}
      </div>
    </div>
  `).join("");
}

function renderBarchasi(q) {
  const items = data.filter(d => (ctype === "all" || d.cat === ctype) && matches(d, q));
  return elementCards(items);
}

function renderMineral(q) {
  const els = data.filter(d => matches(d, q));
  let foods = Object.keys(byFood);
  if (q) foods = foods.filter(f => f.toLowerCase().includes(q) || byFood[f].join(" ").toLowerCase().includes(q));
  foods.sort((a, b) => byFood[b].length - byFood[a].length || a.localeCompare(b));

  let h = '<div class="gt">🧪 Element → qaysi kasalliklar bo\'ladi</div>';
  h += els.length ? els.map(d => `
    <div class="card">
      <h3>${d.name} <span class="symbol">${d.symbol}</span></h3>
      <div class="section def"><b>⚠️ Kamligida rivojlanishi mumkin:</b>${pills(d.dis, "")}</div>
      <div class="section src"><b>🥗 Nimalarda bor:</b>${pills(d.src, "fd")}</div>
    </div>
  `).join("") : '<div class="no-result">😕 Element topilmadi</div>';

  h += '<div class="gt">🥗 Oziq-ovqat → tarkibida qaysi elementlar bor</div>';
  h += foods.length ? foods.map(f => {
    const fd = FOODS[f];
    return `
    <div class="card">
      <h3>${f} <span class="symbol">${byFood[f].length} element</span></h3>
      <div class="section"><b>🧬 Tarkibida:</b>${pills(byFood[f], "el")}</div>
      ${fd ? `<div class="section"><b>📋 100 g dagi tarkibi</b><span class="muted"> (${fd.l} = 1 porsiyon)</span><div>${compPills(fd.e, Object.keys(fd.e).length)}</div></div>`
           : '<div class="muted">Umumiy guruh — aniq 100 g tarkibi keltirilmagan.</div>'}
    </div>`;
  }).join("") : '<div class="no-result">😕 Oziq-ovqat topilmadi</div>';

  return h;
}

function menuFor(elements) {
  const foods = new Set();
  elements.forEach(e => e.src.forEach(f => { if (!NO_MENU.includes(f)) foods.add(f); }));
  const out = {};
  Object.keys(MEALS).forEach(m => {
    out[m] = MEALS[m].filter(f => foods.has(f)).slice(0, 5);
  });
  return out;
}

function renderKasallik(q) {
  if (openDisease && byDisease[openDisease]) {
    const els = byDisease[openDisease].map(n => data.find(d => d.name === n));
    const m = menuFor(els);
    let h = '<button class="back" data-back="1">← Kasalliklar ro\'yxatiga qaytish</button>';
    h += `
      <div class="card">
        <h3>🩺 ${openDisease}</h3>
        <div class="section"><b>Tanqisligi sabab bo'lishi mumkin:</b>${pills(els.map(e => e.name), "el")}</div>
      </div>
      <div class="gt">📏 ${GROUP_LABEL[group]} uchun kunlik me'yor</div>
    `;
    h += els.map(e => `
      <div class="card">
        <h3>${e.name} <span class="symbol">${e.symbol}</span></h3>
        <div class="norm">📏 ${GROUP_LABEL[group]}: ${e.n[group]}</div>
        <div class="section src"><b>🥗 Manbalar:</b>${pills(e.src, "fd")}</div>
      </div>
    `).join("");
    h += '<div class="gt">🍽️ Taxminiy kunlik menyu</div><div class="card">';
    h += Object.keys(MEAL_LABEL).map(k => `
      <div class="meal">
        <b>${MEAL_LABEL[k]}:</b>
        ${m[k].length ? pills(m[k], "fd") : '<span class="badge">—</span>'}
      </div>
    `).join("");
    h += '</div>';
    h += '<div class="note">⚠️ Menyu — ovqat tanlash yo\'nalishi. Aniq gramma va kunlik me\'yorga nisbatni <b>🧮 Hisoblagich</b> panelida ko\'ring (har bir mahsulotning 100 g dagi tarkibi keltirilgan). Davolash dozalarini shifokor belgilaydi.</div>';
    return h;
  }

  let names = Object.keys(byDisease);
  if (q) names = names.filter(n => n.toLowerCase().includes(q) || byDisease[n].join(" ").toLowerCase().includes(q));
  names.sort((a, b) => byDisease[b].length - byDisease[a].length || a.localeCompare(b));

  if (!names.length) return '<div class="no-result">😕 Kasallik topilmadi</div>';

  return '<div class="gt">🩺 Kasallikni tanlang — kunlik me\'yor va menyu chiqadi</div>' + names.map(n => `
    <div class="card row" data-disease="${n}">
      <h3>${n} <span class="symbol">${byDisease[n].length} element</span></h3>
      <div class="section"><b>Sabab bo'lishi mumkin:</b>${pills(byDisease[n], "el")}</div>
    </div>
  `).join("");
}

function fmtVal(v, u) {
  const r = v >= 100 ? Math.round(v) : Math.round(v * 10) / 10;
  return r + " " + u;
}

function symbolOf(name) {
  const d = data.find(x => x.name === name);
  return d ? d.symbol : "";
}

function collected() {
  const sum = {};
  Object.keys(chosen).forEach(f => {
    const fd = FOODS[f];
    if (!fd) return;
    const g = chosen[f] * fd.p / 100;
    Object.keys(fd.e).forEach(el => { sum[el] = (sum[el] || 0) + fd.e[el] * g; });
  });
  return sum;
}

function compPills(el, limit) {
  // zichlik = 100 g dagi miqdorning kunlik me'yorga nisbati (birlardan qat'i nisol)
  const dens = k => RDA[k] ? el[k] / RDA[k].ayollar : -1;
  return Object.keys(el)
    .sort((a, b) => dens(b) - dens(a))
    .slice(0, limit)
    .map(k => {
      const r = RDA[k];
      const v = r ? fmtVal(el[k], r.u) : Math.round(el[k] * 10) / 10;
      return `<span class="badge">${k}: ${v}</span>`;
    }).join("");
}

function renderHisob(q) {
  const GRP = GROUP_LABEL[group];
  const names = Object.keys(chosen);
  const sum = collected();
  let h = "";

  if (names.length) {
    h += `<div class="gt">🧾 Tanlangan ovqatlar · ${GRP}</div>`;
    h += names.map(f => {
      const fd = FOODS[f];
      const jami = chosen[f] * fd.p;
      return `
        <div class="card">
          <div class="frow">
            <div>
              <b>${f}</b> <span class="muted">${fd.l}</span>
              <div class="section">${compPills(fd.e, 4)}</div>
            </div>
            <div class="qty">
              <button class="btn" data-dec="${f}">−</button>
              <span class="badge">${chosen[f]}×</span>
              <button class="btn" data-inc="${f}">+</button>
            </div>
          </div>
          <div class="muted">Jami ${jami} g · <button class="back" data-del="${f}" style="margin:0;padding:2px 8px;font-size:0.75rem">o'chirish</button></div>
        </div>`;
    }).join("");

    const rows = Object.keys(sum).filter(el => RDA[el]).map(el => ({
      el: el, got: sum[el], need: RDA[el][group], u: RDA[el].u
    })).sort((a, b) => a.got / a.need - b.got / b.need);
    const yetdi = rows.filter(r => r.got / r.need >= 1).length;

    h += `<div class="gt">📊 Natija · ${yetdi}/${rows.length} element me'yorga yetdi</div>`;
    h += rows.map(r => {
      const pct = Math.round(r.got / r.need * 100);
      const cls = pct >= 100 ? "ok" : (pct >= 50 ? "warn" : "bad");
      return `
        <div class="card">
          <div class="frow">
            <h3>${r.el} <span class="symbol">${symbolOf(r.el)}</span></h3>
            <span class="badge ${cls}">${pct}%</span>
          </div>
          <div class="section">Top'langan: <span class="val">${fmtVal(r.got, r.u)}</span> · ${GRP} me'yori: <span class="val">${fmtVal(r.need, r.u)}</span></div>
          <div class="bar"><i style="width:${Math.min(pct, 100)}%"></i></div>
        </div>`;
    }).join("");

    const noRda = Object.keys(sum).filter(el => !RDA[el]);
    const yoq = data.filter(d => RDA[d.name] && !sum[d.name]).map(d => d.name);
    h += `
      <div class="card">
        <div class="section"><b>Umuman top'lanmadi:</b>${pills(yoq, "el")}</div>
        ${noRda.length ? `<div class="muted">RDA belgilanmagan — hisoblanmadi: ${noRda.join(", ")}</div>` : ""}
        <div class="muted" style="margin-top:8px"><button class="back" data-clear="1" style="margin:0">Barchasini tozalash</button></div>
      </div>`;
    h += '<div class="note">⚠️ Natija taxminiy: o\'rtacha tarkib va oddiy porsiyonlar asosida. Kasallik davolashini shifokor belgilaydi.</div>';
  } else {
    h += '<div class="note">🧮 Hali ovqat tanlanmagan. Quyidagi ro\'yxatdan qo\'shing — ertalab / obed / kechga emas, kunlik me\'yorga qancha element to\'planishini ko\'rsatadi.</div>';
  }

  let foods = Object.keys(FOODS);
  if (q) foods = foods.filter(f => f.toLowerCase().includes(q) || Object.keys(FOODS[f].e).some(el => el.toLowerCase().includes(q)));

  h += `<div class="gt">➕ Ovqat qo'shish (${foods.length})</div>`;
  h += '<div class="muted" style="margin-bottom:10px">Miqdorlar 100 grammda: ' + Object.keys(RDA).filter(k => RDA[k]).length + " element bo\'yicha.</div>";
  h += foods.length ? foods.map(f => `
    <div class="card">
      <div class="frow">
        <div>
          <b>${f}</b> <span class="muted">${FOODS[f].l}</span>
          <div class="section">${compPills(FOODS[f].e, 4)}</div>
        </div>
        <button class="btn" data-add="${f}">+ Qo'shish</button>
      </div>
    </div>`).join("") : '<div class="no-result">😕 Ovqat topilmadi</div>';

  return h;
}

function draw() {
  const q = searchBox.value.toLowerCase().trim();
  document.getElementById("gtabs").style.display = (cat === "kasallik" || cat === "hisob") ? "flex" : "none";
  document.getElementById("ctabs").style.display = cat === "all" ? "flex" : "none";
  if (cat === "mineral") list.innerHTML = renderMineral(q);
  else if (cat === "kasallik") list.innerHTML = renderKasallik(q);
  else if (cat === "hisob") list.innerHTML = renderHisob(q);
  else list.innerHTML = renderBarchasi(q);
}

function redrawKeep() {
  const y = window.scrollY;
  draw();
  window.scrollTo(0, y);
}

searchBox.addEventListener("input", () => { openDisease = null; draw(); });

document.querySelectorAll("#tabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#tabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    cat = tab.dataset.cat;
    openDisease = null;
    draw();
  });
});

document.querySelectorAll("#ctabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#ctabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    ctype = tab.dataset.ctype;
    draw();
  });
});

document.querySelectorAll("#gtabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#gtabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    group = tab.dataset.group;
    draw();
  });
});

list.addEventListener("click", e => {
  const back = e.target.closest("[data-back]");
  if (back) { openDisease = null; draw(); return; }
  const add = e.target.closest("[data-add]");
  if (add) { const f = add.dataset.add; chosen[f] = (chosen[f] || 0) + 1; redrawKeep(); return; }
  const inc = e.target.closest("[data-inc]");
  if (inc) { chosen[inc.dataset.inc]++; redrawKeep(); return; }
  const dec = e.target.closest("[data-dec]");
  if (dec) { const f = dec.dataset.dec; if (--chosen[f] <= 0) delete chosen[f]; redrawKeep(); return; }
  const del = e.target.closest("[data-del]");
  if (del) { delete chosen[del.dataset.del]; redrawKeep(); return; }
  const clear = e.target.closest("[data-clear]");
  if (clear) { chosen = {}; redrawKeep(); return; }
  const row = e.target.closest("[data-disease]");
  if (row) { openDisease = row.dataset.disease; draw(); window.scrollTo(0, 0); }
});

draw();
</script>
</body>
</html>
